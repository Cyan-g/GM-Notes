# Builds the desktop app for Windows and macOS when a version tag (v1.2.3) is pushed, and publishes the
# installers as a GitHub release. The Windows app updates itself from these releases; the Mac app is told.
name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Mac build isn't signed (no Apple Developer ID); don't look for a certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: false
